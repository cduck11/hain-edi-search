<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDI 수가코드 검색 — 헤인파트너스</title>
<style>
:root{--bg:#0d1117;--sur:#161b22;--sur2:#21262d;--bor:#30363d;--acc:#2563eb;--glow:rgba(37,99,235,.15);--tx:#e6edf3;--mu:#7d8590;--dim:#484f58;--green:#3fb950;--yellow:#d29922;--red:#f85149;--mono:'JetBrains Mono','Fira Code',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Pretendard',sans-serif;min-height:100vh}
header{padding:16px 28px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;background:rgba(13,17,23,.94);backdrop-filter:blur(12px)}
.logo{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}.logo span{color:var(--acc)}
.htitle{font-size:15px;font-weight:600}
.badge{margin-left:auto;background:var(--sur2);border:1px solid var(--bor);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--mu);font-family:var(--mono)}
.pbar-wrap{position:fixed;top:0;left:0;right:0;z-index:999;height:3px;background:var(--sur2)}
.pbar{height:3px;background:linear-gradient(90deg,var(--acc),#8b5cf6);width:0;transition:width .3s}
.layout{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 57px)}
.sidebar{border-right:1px solid var(--bor);padding:18px 14px;overflow-y:auto;height:calc(100vh - 57px);position:sticky;top:57px}
.slabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding:0 8px}
.ssec{margin-bottom:20px}
.fbtn{width:100%;text-align:left;background:none;border:none;padding:6px 10px;border-radius:6px;color:var(--mu);font-size:13px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
.fbtn:hover{background:var(--sur2);color:var(--tx)}
.fbtn.active{background:var(--glow);color:var(--acc);border-left:2px solid var(--acc);padding-left:8px}
.fcnt{font-family:var(--mono);font-size:11px;opacity:.6}
.main{padding:22px 28px}
.sw{position:relative;margin-bottom:8px}
.si{color:var(--dim);position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none}
input#q{width:100%;padding:11px 14px 11px 40px;background:var(--sur);border:1px solid var(--bor);border-radius:10px;color:var(--tx);font-size:15px;outline:none;transition:border-color .2s;font-family:inherit}
input#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
input#q::placeholder{color:var(--dim)}
.hint{font-size:12px;color:var(--dim);margin-bottom:18px}
.hint kbd{background:var(--sur2);border:1px solid var(--bor);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px}
.stats{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--mu)}
.snum{font-family:var(--mono);font-weight:700;color:var(--tx);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--bor);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--sur);padding:9px 14px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--bor);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--bor);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--sur2)}
tbody tr{cursor:pointer}
.ec{font-family:var(--mono);font-weight:700;color:var(--acc);font-size:12px}
.cn{font-family:var(--mono);font-size:11px;color:var(--mu)}
.kn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;display:inline-block}
.tag-급여{background:rgba(63,185,80,.12);color:var(--green)}
.tag-비급여{background:rgba(248,81,73,.12);color:var(--red)}
.tag-선택급여{background:rgba(210,153,34,.12);color:var(--yellow)}
.cost{font-family:var(--mono);font-size:12px;text-align:right}
.z{color:var(--dim)}
.state{padding:60px 32px;text-align:center;color:var(--dim)}
.state .ico{font-size:32px;margin-bottom:12px}
.state p{font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bor);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.pg{display:flex;align-items:center;gap:6px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.pb{padding:5px 11px;border-radius:6px;border:1px solid var(--bor);background:var(--sur);color:var(--mu);cursor:pointer;font-size:13px;transition:all .15s}
.pb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.pb:disabled{opacity:.3;cursor:not-allowed}
.pb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pi{font-size:11px;color:var(--mu);font-family:var(--mono)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.mod{background:var(--sur);border:1px solid var(--bor);border-radius:14px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:26px 28px;position:relative}
.mc{position:absolute;top:12px;right:12px;background:var(--sur2);border:1px solid var(--bor);border-radius:6px;color:var(--mu);font-size:14px;cursor:pointer;padding:4px 10px}
.mec{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--acc);margin-bottom:4px}
.mkn{font-size:18px;font-weight:600;margin-bottom:12px;line-height:1.4}
.bc{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bci{font-size:12px;color:var(--mu);background:var(--sur2);border-radius:4px;padding:3px 8px}
.bcs{color:var(--dim);font-size:10px}
.stl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px;margin-top:4px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.ii{background:var(--sur2);border-radius:8px;padding:10px 12px}
.il{font-size:10px;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
.iv{font-size:13px;font-weight:600;font-family:var(--mono)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.ci{background:var(--sur2);border-radius:8px;padding:10px;text-align:center}
.cl{font-size:10px;color:var(--dim);margin-bottom:4px}
.cv{font-size:15px;font-weight:700;font-family:var(--mono);color:var(--acc)}
.cv.z{color:var(--dim);font-size:13px}
.cht{width:100%;font-size:12px;border-collapse:collapse}
.cht th{background:var(--sur2);padding:7px 10px;color:var(--dim);font-size:10px;text-transform:uppercase;text-align:left}
.cht td{padding:8px 10px;border-bottom:1px solid var(--bor)}
.child-badge{display:inline-block;background:var(--sur2);border:1px solid var(--bor);border-radius:4px;font-size:10px;padding:2px 6px;color:var(--mu);margin-left:6px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="pbar-wrap"><div class="pbar" id="pb"></div></div>
<header>
  <div class="logo">HAIN <span>PARTNERS</span></div>
  <div class="htitle">EDI 수가코드 검색</div>
  <div class="badge" id="badge">로딩 중...</div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="ssec">
      <div class="slabel">진료구분</div>
      <button class="fbtn active" data-key="m" data-val="">전체</button>
      <button class="fbtn" data-key="m" data-val="진료">진료·의치과</button>
      <button class="fbtn" data-key="m" data-val="한방">한방</button>
      <button class="fbtn" data-key="m" data-val="약국">약국</button>
    </div>
    <div class="ssec">
      <div class="slabel">급여구분</div>
      <button class="fbtn active" data-key="p" data-val="">전체</button>
      <button class="fbtn" data-key="p" data-val="급여">급여</button>
      <button class="fbtn" data-key="p" data-val="비급여">비급여</button>
      <button class="fbtn" data-key="p" data-val="선택급여">선택급여</button>
    </div>
    <div class="ssec">
      <div class="slabel">대분류</div>
      <div id="cats"></div>
    </div>
  </aside>
  <main class="main">
    <div class="sw"><span class="si">🔍</span>
      <input type="text" id="q" placeholder="데이터 로딩 중...">
    </div>
    <div class="hint">예: <kbd>HE115</kbd> | <kbd>자기공명</kbd> | <kbd>다246가</kbd> | <kbd>MRI</kbd> | <kbd>D1702000Z</kbd></div>
    <div class="stats"><span class="snum" id="cnt">—</span><span>건 검색됨</span></div>
    <div id="body"><div class="state"><div class="ico">⏳</div><p id="loadmsg">데이터 로딩 중... 잠시만 기다려주세요</p></div></div>
    <div class="pg" id="pg"></div>
  </main>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)cm()">
  <div class="mod" id="mc"></div>
</div>
<script>
const BASE  = 'https://raw.githubusercontent.com/cduck11/hain-edi-search/main';
const TOTAL = 50;
const LIMIT = 30;
let DB = [], filtered = [], curPage = [], state = {q:'',p:'',m:'',cat:'',page:1}, loaded = false;

// ── 데이터 로드 ──
(async () => {
  const pb = document.getElementById('pb');
  const msg = document.getElementById('loadmsg');
  let done = 0;

  const fetches = Array.from({length: TOTAL}, (_, i) =>
    fetch(`${BASE}/chunks/d${String(i).padStart(2,'0')}.json`)
      .then(r => r.json())
      .then(data => { DB.push(...data); done++; pb.style.width = (done/TOTAL*100)+'%'; msg.textContent = `로딩 중... ${DB.length.toLocaleString()} / 398,539`; })
  );
  try {
    await Promise.all(fetches);
  } catch(e) {
    document.getElementById('body').innerHTML = '<div class="state"><div class="ico">⚠️</div><p>로드 실패: '+e.message+'</p></div>';
    return;
  }

  pb.style.width = '100%'; pb.style.background = 'var(--green)';
  setTimeout(() => { pb.style.width = '0'; pb.style.background = ''; }, 500);
  loaded = true;
  document.getElementById('badge').textContent = DB.length.toLocaleString() + ' 건 수록';
  document.getElementById('q').placeholder = '수가코드, 행위명, 분류번호로 검색...';
  document.getElementById('body').innerHTML = '<div class="state"><div class="ico">⌨️</div><p>' + DB.length.toLocaleString() + '건 로드 완료 — 검색어를 입력하거나 필터를 선택하세요</p></div>';
  buildCats();
  bindFilters();
})();

// ── 사이드바 필터 바인딩 ──
function bindFilters() {
  document.querySelectorAll('.fbtn[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key, val = btn.dataset.val;
      state[key] = val; state.page = 1;
      document.querySelectorAll(`.fbtn[data-key="${key}"]`).forEach(b =>
        b.classList.toggle('active', b.dataset.val === val)
      );
      search();
    });
  });
}

function buildCats() {
  const map = {};
  DB.forEach(r => { if (r['2']) map[r['2']] = (map[r['2']] || 0) + 1; });
  const el = document.getElementById('cats');
  Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,20).forEach(([name, cnt]) => {
    const b = document.createElement('button');
    b.className = 'fbtn'; b.dataset.key = 'cat'; b.dataset.val = name;
    b.innerHTML = `<span>${name}</span><span class="fcnt">${cnt.toLocaleString()}</span>`;
    b.addEventListener('click', () => {
      state.cat = state.cat === name ? '' : name;
      state.page = 1;
      document.querySelectorAll('.fbtn[data-key="cat"]').forEach(x =>
        x.classList.toggle('active', x.dataset.val === state.cat)
      );
      search();
    });
    el.appendChild(b);
  });
}

// ── 검색 ──
let dt;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(dt);
  dt = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; search(); }, 300);
});

function search() {
  if (!loaded) return;
  const {q, p, m, cat, page} = state;
  if (!q && !p && !m && !cat) {
    document.getElementById('body').innerHTML = '<div class="state"><div class="ico">⌨️</div><p>검색어를 입력하거나 좌측 필터를 선택하세요</p></div>';
    document.getElementById('cnt').textContent = '—';
    document.getElementById('pg').innerHTML = ''; return;
  }
  const ql = q.toLowerCase();
  filtered = DB.filter(r => {
    if (p && r.p !== p) return false;
    if (m && r.m !== m) return false;
    if (cat && r['2'] !== cat) return false;
    if (q) {
      const s = ((r.e||'')+(r.k||'')+(r.s||'')+(r.c||'')+(r.n||'')).toLowerCase();
      if (!s.includes(ql)) return false;
    }
    return true;
  });
  document.getElementById('cnt').textContent = filtered.length.toLocaleString();
  const offset = (page-1) * LIMIT;
  curPage = filtered.slice(offset, offset + LIMIT);
  renderTable(curPage);
  renderPg(filtered.length, page);
}

// ── 테이블 렌더 ──
function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('body').innerHTML = '<div class="state"><div class="ico">🔎</div><p>검색 결과가 없습니다</p></div>'; return;
  }
  const fmt = v => v ? Number(v).toLocaleString() : null;
  const tb = document.createElement('div');
  tb.className = 'tw';
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>
    <th>수가코드</th><th>분류번호</th><th>행위명</th>
    <th>급여</th><th>구분</th>
    <th style="text-align:right">의원</th><th style="text-align:right">병원</th><th style="text-align:right">RVU</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach((r, idx) => {
    const tr = document.createElement('tr');
    const isChild = r.i === 'Y';
    const nm = r.k || (r.s ? r.s : '');
    const c1 = fmt(r.u), c2 = fmt(r.h);
    if (isChild) tr.style.opacity = '0.85';
    tr.innerHTML = `
      <td><span class="ec" style="${isChild?'font-size:11px':''}">
        ${isChild ? '<span style="color:var(--dim)">↳</span> ' : ''}<span style="${isChild?'color:var(--mu)':''}">${r.e||''}</span>
      </span></td>
      <td><span class="cn">${r.c||''}</span></td>
      <td><span class="kn">${nm}</span>${r.s&&r.k?'<span class="child-badge">'+r.s+'</span>':''}</td>
      <td>${isChild ? '' : `<span class="tag tag-${r.p||''}">${r.p||''}</span>`}</td>
      <td style="color:var(--mu);font-size:11px">${r.m||''}</td>
      <td class="cost ${c1?'':'z'}">${c1||'—'}</td>
      <td class="cost ${c2?'':'z'}">${c2||'—'}</td>
      <td class="cost">${r.r||'—'}</td>`;
    tr.addEventListener('click', () => openDetail(r));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tb.appendChild(table);
  document.getElementById('body').innerHTML = '';
  document.getElementById('body').appendChild(tb);
}

// ── 페이지네이션 ──
function renderPg(total, cur) {
  const pages = Math.ceil(total / LIMIT);
  if (pages <= 1) { document.getElementById('pg').innerHTML = ''; return; }
  const s = Math.max(1, cur-2), e = Math.min(pages, cur+2);
  let h = `<button class="pb" onclick="gp(${cur-1})" ${cur===1?'disabled':''}>←</button>`;
  if (s > 1) h += `<button class="pb" onclick="gp(1)">1</button>${s>2?'<span style=color:var(--dim)>…</span>':''}`;
  for (let i=s; i<=e; i++) h += `<button class="pb ${i===cur?'on':''}" onclick="gp(${i})">${i}</button>`;
  if (e < pages) h += `${e<pages-1?'<span style=color:var(--dim)>…</span>':''}<button class="pb" onclick="gp(${pages})">${pages}</button>`;
  h += `<button class="pb" onclick="gp(${cur+1})" ${cur===pages?'disabled':''}>→</button>`;
  h += `<span class="pi">${cur}/${pages}p (${total.toLocaleString()}건)</span>`;
  document.getElementById('pg').innerHTML = h;
}
function gp(p) { state.page = p; search(); window.scrollTo(0, 180); }

// ── 상세 모달 ──
function openDetail(r) {
  const bc = [r['1'], r['2'], r['3']].filter(Boolean);
  const ov = document.getElementById('ov');
  ov.classList.add('open');
  const el = document.getElementById('mc');
  el.innerHTML = `
    <button class="mc" onclick="cm()">✕</button>
    <div class="mec">${r.e||''}</div>
    <div class="mkn">${r.k || r.s || '—'}</div>
    ${r.n ? `<div style="font-size:13px;color:var(--mu);margin-bottom:10px">${r.n}</div>` : ''}
    ${r.s && r.k ? `<div style="font-size:12px;color:var(--dim);margin-bottom:10px">산정명: ${r.s}</div>` : ''}
    ${r.pe ? `<div style="font-size:12px;color:var(--mu);margin-bottom:10px">부모코드: <span style="font-family:var(--mono);color:var(--acc);cursor:pointer" onclick="searchByCode('${r.pe}')">${r.pe}</span></div>` : ''}
    ${bc.length ? `<div class="bc">${bc.map((b,i)=>`<span class="bci">${b}</span>${i<bc.length-1?'<span class="bcs">›</span>':''}`).join('')}</div>` : ''}
    <div class="stl">기본 정보</div>
    <div class="ig">
      <div class="ii"><div class="il">분류번호</div><div class="iv">${r.c||'—'}</div></div>
      <div class="ii"><div class="il">적용일</div><div class="iv">${r.d||'—'}</div></div>
      <div class="ii"><div class="il">급여구분</div><div class="iv"><span class="tag tag-${r.p||''}">${r.p||'—'}</span></div></div>
      <div class="ii"><div class="il">상대가치점수</div><div class="iv">${r.r||'—'}</div></div>
    </div>
    <div class="stl">요양기관 종별 단가 (원)</div>
    <div class="cg">
      <div class="ci"><div class="cl">의원</div><div class="cv ${!r.u?'z':''}">${r.u?Number(r.u).toLocaleString():'—'}</div></div>
      <div class="ci"><div class="cl">병원</div><div class="cv ${!r.h?'z':''}">${r.h?Number(r.h).toLocaleString():'—'}</div></div>
      <div class="ci"><div class="cl">치과병원</div><div class="cv ${!r.t?'z':''}">${r.t?Number(r.t).toLocaleString():'—'}</div></div>
      <div class="ci"><div class="cl">한방/요양</div><div class="cv ${!r.o?'z':''}">${r.o?Number(r.o).toLocaleString():'—'}</div></div>
    </div>
  `;
}

function searchByCode(code) {
  cm();
  document.getElementById('q').value = code;
  state.q = code; state.page = 1;
  search();
}

function cm() { document.getElementById('ov').classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cm();
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) {
    e.preventDefault(); document.getElementById('q').focus();
  }
});
</script>
</body>
</html>
