<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDI 수가코드 검색 — 헤인파트너스</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #2563eb;
    --accent-glow: rgba(37,99,235,0.15);
    --text: #e6edf3;
    --text-muted: #7d8590;
    --text-dim: #484f58;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #8b5cf6;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; }

  /* Header */
  header { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.92); backdrop-filter: blur(12px); }
  .logo { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
  .logo span { color: var(--accent); }
  .header-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .db-badge { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

  /* Layout */
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 61px); }

  /* Sidebar */
  .sidebar { border-right: 1px solid var(--border); padding: 24px 16px; overflow-y: auto; height: calc(100vh - 61px); position: sticky; top: 61px; }
  .sidebar-section { margin-bottom: 24px; }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; padding: 0 8px; }
  .filter-btn { width: 100%; text-align: left; background: none; border: none; padding: 6px 10px; border-radius: 6px; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--accent-glow); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; }
  .filter-btn .cnt { font-family: var(--mono); font-size: 11px; opacity: 0.6; }

  /* Main */
  .main { padding: 24px 32px; overflow-y: auto; }

  /* Search bar */
  .search-area { margin-bottom: 24px; }
  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; pointer-events: none; }
  #searchInput { width: 100%; padding: 12px 16px 12px 42px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; font-family: inherit; }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #searchInput::placeholder { color: var(--text-dim); }
  .search-hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .search-hint kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 11px; }

  /* Stats bar */
  .stats-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); }
  .stat-num { font-family: var(--mono); font-weight: 700; color: var(--text); font-size: 13px; }

  /* Filters row */
  .filters-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Table */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { position: sticky; top: 0; }
  th { background: var(--surface); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  tr { cursor: pointer; }

  .edi-code { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 12px; }
  .class-num { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .kor-nm { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pay-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
  .pay-급여 { background: rgba(63,185,80,0.12); color: var(--green); }
  .pay-비급여 { background: rgba(248,81,73,0.12); color: var(--red); }
  .pay-선택급여 { background: rgba(210,153,34,0.12); color: var(--yellow); }
  .cost { font-family: var(--mono); font-size: 12px; text-align: right; }
  .cost-zero { color: var(--text-dim); }

  /* Loading / Empty */
  .state-box { padding: 64px 32px; text-align: center; color: var(--text-dim); }
  .state-box .icon { font-size: 32px; margin-bottom: 12px; }
  .state-box p { font-size: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pagination */
  .pagination { display: flex; align-items: center; gap: 8px; margin-top: 20px; justify-content: center; }
  .page-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-info { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  /* Detail modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 32px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; padding: 28px 32px; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px 10px; }
  .modal-close:hover { color: var(--text); }
  .modal-edi { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .modal-kor { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-section { margin-bottom: 20px; }
  .modal-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 10px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .detail-item { background: var(--surface2); border-radius: 8px; padding: 10px 14px; }
  .detail-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .detail-value { font-size: 13px; font-weight: 600; font-family: var(--mono); }
  .cost-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cost-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; text-align: center; }
  .cost-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  .cost-value { font-size: 15px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
  .cost-value.zero { color: var(--text-dim); font-size: 13px; }
  .breadcrumb { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .bc-item { font-size: 12px; color: var(--text-muted); background: var(--surface2); border-radius: 4px; padding: 3px 8px; }
  .bc-sep { color: var(--text-dim); font-size: 10px; }
  .children-table { width: 100%; font-size: 12px; }
  .children-table th { background: var(--surface2); padding: 7px 10px; color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .children-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">HAIN <span>PARTNERS</span></div>
  <div class="header-title">EDI 수가코드 검색</div>
  <div class="db-badge" id="dbBadge">— 건</div>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">진료구분</div>
      <button class="filter-btn active" onclick="setFilter('med','')">전체</button>
      <button class="filter-btn" onclick="setFilter('med','진료')">진료·의치과</button>
      <button class="filter-btn" onclick="setFilter('med','한방')">한방</button>
      <button class="filter-btn" onclick="setFilter('med','약국')">약국</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">급여구분</div>
      <button class="filter-btn active" onclick="setFilter('pay','')">전체</button>
      <button class="filter-btn" onclick="setFilter('pay','급여')">급여</button>
      <button class="filter-btn" onclick="setFilter('pay','비급여')">비급여</button>
      <button class="filter-btn" onclick="setFilter('pay','선택급여')">선택급여</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">대분류</div>
      <div id="catList"></div>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <div class="search-area">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="수가코드, 행위명, 분류번호로 검색..." autocomplete="off">
      </div>
      <div class="search-hint">예: <kbd>D1702</kbd> &nbsp;|&nbsp; <kbd>B형간염</kbd> &nbsp;|&nbsp; <kbd>누702</kbd> &nbsp;|&nbsp; <kbd>MRI</kbd></div>
    </div>

    <div class="stats-bar">
      <span id="resultCount" class="stat-num">—</span>
      <span>건 검색됨</span>
    </div>

    <div id="content">
      <div class="state-box">
        <div class="icon">⌨️</div>
        <p>수가코드·행위명 입력 또는 좌측 필터로 38만개 코드를 탐색하세요</p>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
let state = { q: '', pay: '', med: '', cat: '', page: 1 };
let debounceTimer;

// 초기화
window.addEventListener('load', async () => {
  // DB 총 건수
  const r = await fetch('/api/search?q=%20&limit=1').catch(()=>{});
  // 카테고리 로드
  const cats = await fetch('/api/categories').then(r=>r.json()).catch(()=>[]);
  const cl = document.getElementById('catList');
  cats.slice(0,15).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span>${c.name||'미분류'}</span><span class="cnt">${c.count.toLocaleString()}</span>`;
    btn.onclick = () => setFilter('cat', c.name);
    cl.appendChild(btn);
  });
  // DB 배지
  const total = await fetch('/api/search?q=D&limit=1').then(r=>r.json()).catch(()=>({total:0}));
  document.getElementById('dbBadge').textContent = '398,539 건 수록';
});

document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    state.q = e.target.value.trim();
    state.page = 1;
    doSearch();
  }, 280);
});

function setFilter(key, val) {
  state[key] = val;
  state.page = 1;
  // 검색어는 유지하되 필터 버튼 active 갱신
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const oc = btn.getAttribute('onclick') || '';
    if (oc.includes("'" + key + "'")) {
      const match = oc.includes("'" + val + "'") || (val === '' && /setFilter\('[^']+','\s*'\s*'/.test(oc));
      btn.classList.toggle('active', match);
    }
  });
  doSearch();
}

async function doSearch() {
  const { q, pay, med, cat, page } = state;
  if (!q && !pay && !med && !cat) {  // 검색어도 필터도 없을 때만 초기화
    document.getElementById('content').innerHTML = '<div class="state-box"><div class="icon">⌨️</div><p>수가코드·행위명 입력 또는 좌측 필터로 38만개 코드를 탐색하세요</p></div>';
    document.getElementById('resultCount').textContent = '—';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('content').innerHTML = '<div class="state-box"><span class="spinner"></span> 검색 중...</div>';

  const params = new URLSearchParams({ q, pay, med, cat, page, limit: 30 });
  const data = await fetch('/api/search?' + params).then(r => r.json()).catch(() => ({ results: [], total: 0 }));

  document.getElementById('resultCount').textContent = data.total.toLocaleString();
  renderTable(data.results);
  renderPagination(data.total, page, 30);
}

function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('content').innerHTML = '<div class="state-box"><div class="icon">🔎</div><p>검색 결과가 없습니다</p></div>';
    return;
  }
  const fmt = v => v ? Number(v).toLocaleString() : null;
  const html = `
  <div class="table-wrap">
  <table>
    <thead><tr>
      <th>수가코드</th><th>분류번호</th><th>행위명</th>
      <th>급여</th><th>구분</th>
      <th style="text-align:right">의원</th>
      <th style="text-align:right">병원</th>
      <th style="text-align:right">RVU</th>
    </tr></thead>
    <tbody>
    ${rows.map(r => {
      const c1 = fmt(r.unprc_clinic);
      const c2 = fmt(r.unprc_hospital);
      return `<tr onclick="openDetail('${r.edi_code}')">
        <td><span class="edi-code">${r.edi_code||''}</span></td>
        <td><span class="class-num">${r.class_num||''}</span></td>
        <td><span class="kor-nm" title="${r.kor_nm||''}">${r.kor_nm||''}${r.sanjung_nm?'<br><small style=color:var(--text-dim)>'+r.sanjung_nm+'</small>':''}</span></td>
        <td><span class="pay-badge pay-${r.pay_type}">${r.pay_type}</span></td>
        <td style="color:var(--text-muted);font-size:11px">${r.medical_type}</td>
        <td class="cost ${c1?'':'cost-zero'}">${c1||'—'}</td>
        <td class="cost ${c2?'':'cost-zero'}">${c2||'—'}</td>
        <td class="cost">${r.cval_pnt||'—'}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>
  </div>`;
  document.getElementById('content').innerHTML = html;
}

function renderPagination(total, current, limit) {
  const pages = Math.ceil(total / limit);
  if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  const start = Math.max(1, current - 2);
  const end = Math.min(pages, current + 2);
  let html = `<button class="page-btn" onclick="goPage(${current-1})" ${current===1?'disabled':''}>←</button>`;
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>${start>2?'<span style=color:var(--text-dim)>…</span>':''}`;
  for (let i = start; i <= end; i++) html += `<button class="page-btn ${i===current?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (end < pages) html += `${end<pages-1?'<span style=color:var(--text-dim)>…</span>':''}<button class="page-btn" onclick="goPage(${pages})">${pages}</button>`;
  html += `<button class="page-btn" onclick="goPage(${current+1})" ${current===pages?'disabled':''}>→</button>`;
  html += `<span class="page-info">${current}/${pages}p (${total.toLocaleString()}건)</span>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) { state.page = p; doSearch(); }

async function openDetail(ediCode) {
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalContent').innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner"></span> 로딩 중...</div>';
  const d = await fetch('/api/detail/' + ediCode).then(r=>r.json());
  const r = d.data;
  const fmt = v => v ? Number(v).toLocaleString()+'원' : '<span style=color:var(--text-dim)>—</span>';

  const bc = [r.class1, r.class2, r.class3, r.class4, r.class5].filter(Boolean);
  const children = d.children || [];

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-edi">${r.edi_code}</div>
    <div class="modal-kor">${r.kor_nm || '—'}</div>
    ${r.eng_nm ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">${r.eng_nm}</div>` : ''}
    ${r.sanjung_nm ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:16px">산정명: ${r.sanjung_nm}</div>` : ''}

    <div class="breadcrumb">
      ${bc.map((b,i)=>`<span class="bc-item">${b}</span>${i<bc.length-1?'<span class="bc-sep">›</span>':''}`).join('')}
    </div>

    <div class="modal-section">
      <div class="modal-section-title">기본 정보</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">분류번호</div><div class="detail-value">${r.class_num||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">적용일</div><div class="detail-value">${r.apply_date||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">급여구분</div><div class="detail-value"><span class="pay-badge pay-${r.pay_type}">${r.pay_type||'—'}</span></div></div>
        <div class="detail-item"><div class="detail-label">진료구분</div><div class="detail-value">${r.medical_type||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">상대가치점수</div><div class="detail-value">${r.cval_pnt||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">수술여부</div><div class="detail-value">${r.operate_yn||'—'}</div></div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">요양기관 종별 단가</div>
      <div class="cost-grid">
        <div class="cost-item"><div class="cost-label">의원</div><div class="cost-value ${!r.unprc_clinic||r.unprc_clinic==0?'zero':''}">${r.unprc_clinic?Number(r.unprc_clinic).toLocaleString():'—'}</div></div>
        <div class="cost-item"><div class="cost-label">병원</div><div class="cost-value ${!r.unprc_hospital||r.unprc_hospital==0?'zero':''}">${r.unprc_hospital?Number(r.unprc_hospital).toLocaleString():'—'}</div></div>
        <div class="cost-item"><div class="cost-label">치과병원</div><div class="cost-value ${!r.unprc_dental||r.unprc_dental==0?'zero':''}">${r.unprc_dental?Number(r.unprc_dental).toLocaleString():'—'}</div></div>
        <div class="cost-item"><div class="cost-label">한방/요양</div><div class="cost-value ${!r.unprc_oriental||r.unprc_oriental==0?'zero':''}">${r.unprc_oriental?Number(r.unprc_oriental).toLocaleString():'—'}</div></div>
      </div>
    </div>

    ${children.length ? `
    <div class="modal-section">
      <div class="modal-section-title">하위 코드 (${children.length}개)</div>
      <table class="children-table">
        <thead><tr><th>코드</th><th>산정명</th><th style=text-align:right>의원</th><th style=text-align:right>병원</th></tr></thead>
        <tbody>${children.map(c=>`
          <tr style="cursor:pointer" onclick="openDetail('${c.edi_code}')">
            <td style="font-family:var(--mono);color:var(--accent);font-size:11px">${c.edi_code}</td>
            <td style="font-size:11px;color:var(--text-muted)">${c.sanjung_nm||c.kor_nm||''}</td>
            <td style="font-family:var(--mono);font-size:11px;text-align:right">${c.unprc_clinic?Number(c.unprc_clinic).toLocaleString():'—'}</td>
            <td style="font-family:var(--mono);font-size:11px;text-align:right">${c.unprc_hospital?Number(c.unprc_hospital).toLocaleString():'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}
  `;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
</script>
</body>
</html>
